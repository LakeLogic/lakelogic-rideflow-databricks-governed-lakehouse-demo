dataset: rider_profiles

version: 1.0.0

info:
  title: rider_profiles
  table_name: rider_profiles
  description: Drafted from a data profile of landing_marketplace/rideflow/rider_profiles (800 rows read
    on azure adls gen2 demo). The quality rules are the ones agreed in its rule set.
  target_layer: bronze
  domain: marketplace
  system: rideflow

model:
  fields:
  - name: rider_id
    type: string
  - name: name
    type: string
  - name: email
    type: string
  - name: phone
    type: string
  - name: date_of_birth
    type: date
  - name: home_address
    type: string
  - name: city_code
    type: string
  - name: signup_date
    type: date
  - name: status
    type: string
  - name: preferred_payment_method
    type: string
  - name: updated_at
    type: timestamp

source:
  type: landing
  path: '{landing_root}/landing_marketplace/rideflow/rider_profiles'

quality:
  row_rules:
  - name: rider_id_required
    category: completeness
    severity: error
    sql: rider_id IS NOT NULL
  - name: status_required
    category: completeness
    severity: error
    sql: status IS NOT NULL
  - name: preferred_payment_method_values
    category: validity
    severity: error
    sql: preferred_payment_method IS NULL OR preferred_payment_method IN ('apple_pay', 'bank_transfer',
      'credit_card', 'debit_card', 'google_pay', 'paypal')
  - name: status_values
    category: validity
    severity: error
    sql: status IS NULL OR status IN ('active', 'deleted', 'inactive', 'pending', 'suspended')
  dataset_rules: []
