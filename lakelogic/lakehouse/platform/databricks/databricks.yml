bundle:
  name: rideflow-drivers-trips

include:
- resources/*.yml
- resources/*/*.yml

sync:
  paths:
  - .
  - ../../contracts
  exclude:
  - tests

variables:
  catalog:
    description: The Unity Catalog this target reads and writes (from the deployment
      target).
    default: rideflow_drivers_trips_dev
  catalog_storage_root:
    description: Storage location for a catalog setup creates (MANAGED LOCATION <root>/<catalog>).
      Blank = the metastore's own storage.
    default: ''
  lakelogic_version:
    description: The LakeLogic version installed (from the deployment target).
    default: 1.89.0
  lakelogic_wheel:
    description: Path to a LakeLogic wheel in a Volume. Blank installs from PyPI.
    default: ''
  lakelogic_extras:
    description: The LakeLogic extras installed (documents = the PDF, image and Word
      readers).
    default: synthetic,pdf,documents
  telemetry_endpoint:
    description: LakeLogic run-log ingest URL. Blank = run logs stay in the lakehouse.
    default: https://reimburse-stable-same.ngrok-free.dev/api/v1/operations/run-logs/ingest
  telemetry_key_scope:
    description: Databricks secret scope holding the LakeLogic API key. The key is
      never stored here.
    default: ''
  telemetry_key_secret:
    description: Secret NAME within that scope. Not a secret itself.
    default: ''
  synthetic_data:
    description: Allow the synthetic-seed job to write test data (false on prod).
    default: 'true'
  telemetry_endpoint_secret:
    description: Secret NAME in that scope holding the ingest URL, used when telemetry_endpoint
      is blank. Not a secret itself.
    default: ''
  landing_storage_account:
    description: Where landing files come from (Deliver data-source step). Blank =
      set it before the first run.
    default: ''
  landing_container:
    description: Where landing files come from (Deliver data-source step). Blank =
      set it before the first run.
    default: ''

workspace:
  root_path: /Workspace/Shared/rideflow_drivers_trips/dev

targets:
  dev:
    default: true
    variables:
      catalog: rideflow_drivers_trips_dev
      lakelogic_version: 1.89.0
      lakelogic_wheel: ''
      telemetry_key_scope: ''
      telemetry_key_secret: ''
      landing_storage_account: salakelogicdemolanding
      landing_container: landing
    workspace:
      root_path: /Workspace/Shared/rideflow_drivers_trips/dev
