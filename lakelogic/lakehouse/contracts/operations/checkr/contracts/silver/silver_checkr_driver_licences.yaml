version: 1.0.0

info:
  title: Silver — Checkr Driver Licences
  target_layer: silver
  table_name: '{silver_layer}_checkr_driver_licences'
  system: checkr
  domain: operations

model:
  fields:
  - name: file_path
    type: string
    required: false
  - name: name
    type: string
    required: false
    pii: true
    classification: person_name
    description: Personal data (person_name), not masked.
  - name: licence_no
    type: string
    required: true
    pii: true
    classification: licence_id
    description: Personal data (licence_id), not masked.
  - name: dob
    type: date
    required: false
    pii: true
    classification: date_of_birth
    description: Personal data (date_of_birth), not masked.
  - name: exp
    type: date
    required: false
  - name: classes
    type: string
    required: false

primary_key:
- licence_no

quality:
  row_rules:
  - name: licence_no_not_null
    sql: licence_no IS NOT NULL
    category: completeness
    description: licence_no is always present (never null).

transformations:
- deduplicate:
    by:
    - licence_no
    sort_by:
    - _lakelogic_processed_at
    order: desc

dataset: silver_checkr_driver_licences

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_checkr_driver_licences
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
