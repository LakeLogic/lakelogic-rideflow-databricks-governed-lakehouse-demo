version: 1.0.0

info:
  title: Silver — Rideflow Driver Profiles
  target_layer: silver
  table_name: '{silver_layer}_rideflow_driver_profiles'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: driver_id
    type: string
    required: true
  - name: name
    type: string
    required: false
    pii: true
    classification: person_name
    description: Personal data (person_name), not masked.
  - name: email
    type: string
    required: false
    pii: true
    classification: email
    description: Personal data (email), not masked.
  - name: phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Personal data (phone), not masked.
  - name: date_of_birth
    type: string
    required: false
    pii: true
    classification: date_of_birth
    description: Personal data (date_of_birth), not masked.
  - name: home_address
    type: string
    required: false
    pii: true
    classification: postal_address
    description: Personal data (postal_address), not masked.
  - name: licence_number
    type: string
    required: false
    pii: true
    classification: licence_id
    description: Personal data (licence_id), not masked.
  - name: licence_plate
    type: string
    required: false
    pii: true
    classification: licence_plate
    description: Personal data (licence_plate), not masked.
  - name: vehicle_type
    type: string
    required: false
  - name: bank_account_last_four
    type: string
    required: false
    sensitive: true
    classification: financial_account
    description: Confidential (financial_account), not masked.
  - name: city_code
    type: string
    required: false
  - name: signup_date
    type: date
    required: false
  - name: status
    type: string
    required: false
  - name: rating
    type: float
    required: false
  - name: updated_at
    type: timestamp
    required: false

primary_key:
- driver_id

quality:
  row_rules:
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).

transformations:
- deduplicate:
    by:
    - driver_id
    sort_by:
    - updated_at
    order: desc

dataset: silver_rideflow_driver_profiles

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_rideflow_driver_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
