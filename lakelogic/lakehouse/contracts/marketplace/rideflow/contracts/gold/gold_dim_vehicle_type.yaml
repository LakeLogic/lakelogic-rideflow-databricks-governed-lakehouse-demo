version: 1.0.0

info:
  title: Gold — Dim Vehicle Type
  target_layer: gold
  description: 'grain: one row per vehicle_type'
  table_name: '{gold_layer}_dim_vehicle_type'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: vehicle_type_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: vehicle_type
    type: string
    required: true
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_vehicle_type

primary_key:
- vehicle_type

quality:
  dataset_rules:
  - unique:
      columns:
      - vehicle_type
      name: vehicle_type_unique
      category: uniqueness
      description: No two rows share the same vehicle_type.

materialization:
  scd1:
    surrogate_key: vehicle_type_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT vehicle_type
    FROM source
    WHERE vehicle_type IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_driver_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
