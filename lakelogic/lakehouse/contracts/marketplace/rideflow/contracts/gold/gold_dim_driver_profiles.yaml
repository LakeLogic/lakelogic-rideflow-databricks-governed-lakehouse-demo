version: 1.0.0

info:
  title: Gold — Dim Driver Profiles (SCD2)
  target_layer: gold
  description: 'grain: one row per driver'
  table_name: '{gold_layer}_dim_driver_profiles'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: driver_profiles_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key and the version start,
      written by the materializer; ''-1'' is the unknown member.'
  - name: driver_id
    type: string
    required: true
  - name: name
    type: string
    required: false
    pii: true
    classification: person_name
    description: Personal data (person_name), not masked.
  - name: email
    type: string
    required: false
    pii: true
    classification: email
    description: Personal data (email), not masked.
  - name: phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Personal data (phone), not masked.
  - name: date_of_birth
    type: string
    required: false
    pii: true
    classification: date_of_birth
    description: Personal data (date_of_birth), not masked.
  - name: home_address
    type: string
    required: false
    pii: true
    classification: postal_address
    description: Personal data (postal_address), not masked.
  - name: licence_number
    type: string
    required: false
    pii: true
    classification: licence_id
    description: Personal data (licence_id), not masked.
  - name: licence_plate
    type: string
    required: false
    pii: true
    classification: licence_plate
    description: Personal data (licence_plate), not masked.
  - name: bank_account_last_four
    type: string
    required: false
    sensitive: true
    classification: financial_account
    description: Confidential (financial_account), not masked.
  - name: signup_date
    type: date
    required: false
  - name: status
    type: string
    required: false
  - name: rating
    type: float
    required: false
  - name: effective_from
    type: timestamp
    required: false
    description: SCD2 effective from, written by the materializer.
  - name: effective_to
    type: timestamp
    required: false
    description: SCD2 effective to, written by the materializer.
  - name: is_current
    type: boolean
    required: false
    description: SCD2 current flag, written by the materializer.
  - name: version_number
    type: long
    required: false
    description: SCD2 version column, written by the materializer.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_driver_profiles

primary_key:
- driver_id

materialization:
  strategy: scd2
  scd2:
    surrogate_key: driver_profiles_sk
    surrogate_key_strategy: hash
    timestamp_field: updated_at
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    version_column: version_number
    track_columns:
    - status
    - rating
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

quality:
  dataset_rules:
  - unique:
      columns:
      - driver_id
      - effective_from
      name: driver_id_effective_from_unique
      category: uniqueness
      description: No two rows share the same driver_id, effective_from.

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_driver_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''
